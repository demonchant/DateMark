name: Deploy DateMark to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out product source
        uses: actions/checkout@v4
      - name: Prepare only the public app files
        run: |
          mkdir -p _site/src
          cp index.html _site/index.html
          cp src/styles.css src/parser.js src/app.js src/favicon.svg _site/src/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
